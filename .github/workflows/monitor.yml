name: Syosetu Chapter Monitor

on:
  #schedule:
    # Runs every 10 minutes (GitHub throttles crons shorter than 5 mins)
    #- cron: '*/10 * * * *'
  # Allows you to manually trigger the workflow from the Actions tab to test it
  workflow_dispatch:

permissions:
  # Required so the action can save the updated last_chapter.txt file
  contents: write

jobs:
  check-chapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run chapter checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_novel.py

      - name: Commit updated chapter counts
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add chapters.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update chapters.json"
          git push
